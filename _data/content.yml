# Order here is the order on the page.
#   spotlight: true   full width card, media beside the text (the thesis)
#   featured: true    gradient bar on top of the card
#   video / poster    use instead of image for an inline muted loop
#   lead, award       the small line above the title; role adds plain text
projects:
  - title: Autonomous Indoor UAV with SLAM and Thermal Surveying
    tags: [ai, robotics]
    spotlight: true
    featured: true
    lead: Undergraduate thesis
    video:
      mp4: assets/video/uav-demo.mp4
      poster: assets/img/uav-poster.webp
      label: Short clip of the autonomous indoor UAV in flight
    text: >-                                     # HTML ok
      An autonomous quadcopter for GPS denied indoor flight, designed and assembled from
      scratch, with LiDAR SLAM, optical flow stabilisation and onboard thermal imaging
      feeding a live survey. Built end to end, from the airframe and sensor integration
      to the ROS&nbsp;2 and PX4 stack that flies it.
    chips: [ROS 2, PX4, Nav2, slam-toolbox, Gazebo, MAVLink, Pixhawk 6C]
    links:
      - label: Thesis book
        url: https://drive.google.com/file/d/1je-og2tN93wE13JT9YaWHDui7SlkzIIq/view?usp=sharing
      - label: Full demo video
        url: https://youtu.be/KSZB9LvfkQg
      - label: GitHub
        url: https://github.com/mashmahmood/ws_offboard_control
  
  - title: Automated Buckling Load Determination
    tags: [robotics, mechanical]
    lead: Electro mechanical system design
    image: assets/img/buckling.webp
    alt: Automated buckling load test rig
    text: >-
      A rig that finds the critical buckling load of a slender column on its own:
      hydraulic actuation under Arduino control, with a real time detection algorithm
      calling the buckling point live instead of by eye.
    chips: [Arduino Mega, Load cell + HX711, Hydraulics, Control]
    links:
      - label: Poster
        url: https://drive.google.com/file/d/1Z4xrh70JVJ79gZ57j2d0oMXJqUDwjnv1/view?usp=sharing
      - label: Overview
        url: https://youtu.be/QeiWl80-ftg
      - label: Guide
        url: https://youtu.be/Pe4uGSBcJqo


  - title: DL Sprint 2.0, Bengali Document Layout Analysis
    tags: [ai]
    lead: BUET CSE Fest
    award: BUET Rising Team
    image: assets/img/dlsprint.webp
    alt: DL Sprint Bengali document layout analysis
    text: >-
      A deep learning competition on segmenting and classifying regions of Bengali
      document images. Our approach and results were written up as a paper and presented
      at the festival.
    chips: [Deep learning, Computer vision, Segmentation, Python]
    links:
      - label: Presented paper
        url: https://drive.google.com/file/d/14pGRnZ0fPzqz3XTXdz7R4WcKZse4zY12/view?usp=sharing

  - title: Steal the Flag, Game AI Agent
    tags: [ai, games]
    lead: BUET CSE Fest AI Contest
    award: 5th place
    image: assets/img/aicontest.webp
    alt: Steal the Flag competitive game AI agent
    text: >-
      A competitive bot for an adversarial capture the flag arena: strategy, pathfinding
      and heuristics tuned across rounds of head to head matches against other teams.
    chips: [Game AI, Pathfinding, Heuristics]
    links:
      - label: Source on GitHub
        url: https://github.com/mashmahmood/codinggame_stealtheflag

  - title: Compact Heat Exchanger for Two Wheelers
    tags: [mechanical]
    lead: Thermo fluid system design
    image: assets/img/heatexchanger.webp
    alt: Compact louvered fin heat exchanger for two wheelers
    text: >-
      Flat tubes and triangular louvered fins that outperform the conventional design on
      heat transfer. A Python optimiser searched fin and tube geometry to cut weight
      while holding performance, and the winning design was manufactured and pressure
      tested.
    chips: [Python, Thermal design, Optimisation, Laser cutting]
    links:
      - label: Report
        url: https://drive.google.com/file/d/1qZ2tPLo2bX1O4M4IzsQ0tO_CYrqdp-Rn/view?usp=sharing

  - title: BRTA Driver Training Simulator
    tags: [games]
    lead: Unity
    role: Contributor
    image: assets/img/simulator.webp
    alt: BRTA manual transmission driver training simulator
    text: >-
      A manual transmission driver training simulator built in Unity, with Logitech
      steering wheel and gear shifter peripherals wired in so the vehicle handles the way
      a real one does.
    chips: [Unity, "C#", Vehicle physics, Hardware I/O]
    links:
      - label: Demo video
        url: https://drive.google.com/file/d/1_D9t0WSmSG-gKEQoYqpyvuMCEqEKiS3M/view?usp=sharing

