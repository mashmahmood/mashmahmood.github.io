# =============================== 01 / ABOUT ================================
about:
  heading: Brief Introduction
  portrait: assets/img/portrait.webp
  portrait_alt: Portrait of Mashrur Mahmood
  paragraphs:                                   # HTML ok
    - >-
      I am a Software Engineer based in Dhaka, dedicated to building secure and efficient software systems. 
      I complement my industry experience with ongoing academic research as an MSc Cybersecurity student in the Department of CSE at BUET.
    - >-
      My path into software runs through competitive programming, where I reached Expert on
      Codeforces and competed at the ICPC Dhaka Regional, and through a mechanical engineering
      degree where the most interesting problems kept turning out to be software ones: flight
      control on ROS&nbsp;2, real time detection on a microcontroller, a Python optimiser for a
      heat exchanger. I enjoy problems that need both algorithmic depth and practical judgement,
      and I value collaboration as much as owning a piece of work end to end.
    - >-
      Outside of engineering, I enjoy films, series, and reading.
      I also have a strong interest in design and visual work,
      which often influences how I approach the projects I build.
  interests: [Movies, Series, Books, Design, Anime, Games]
  now: >-                                        # HTML ok
    Deploying robust SaaS solutions via infrastructure as code and automated CI/CD release pipelines, 
    while pursuing an MSc in Cybersecurity at BUET.

# where and note: HTML ok
experience:
  - when: 2026 to present
    title: Software Engineer, Info Inlet
    where: Remote
    note: >-
      Shipped multiple SaaS products on AWS Marketplace and Microsoft Azure Marketplace, covering
      backend APIs, infrastructure, CI/CD and release. Built <strong>AI Cloud Gateway</strong>, an
      OpenAI compatible LLM router for Amazon Bedrock and Azure AI Foundry: a FastAPI backend on
      Lambda behind API Gateway and CloudFront, with Cognito auth, DynamoDB storage and a
      Next.js / TypeScript dashboard on S3. Built <strong>Data Guard</strong>, PII, PHI and secret
      detection and redaction for LLM pipelines, served as an HTTPS API on Lambda and as an MCP
      server in Docker on Bedrock AgentCore. Integrated marketplace subscription, licensing and
      usage metering with EventBridge and SQS, with API keys stored hashed. All infrastructure is
      code in Terraform and CloudFormation, and GitHub Actions tests and deploys every release.
  - when: Mar 2025
    title: Industrial Attachment, United Ashuganj Energy Ltd.
    where: 195&nbsp;MW combined cycle gas engine power plant, Ashuganj
    note: >-
      A 13 day training programme across plant operations, covering gas engines, HRSGs, steam
      turbines and substations, with time at the DCS and SCADA desks.
    link:
      label: Training report
      url: https://drive.google.com/file/d/1FGOMm-W1k0tzop3Tp_RQ-_Vlo7KT0Nnw/view?usp=sharing

